<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人员档案 · 拖动排序</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff;
    color: #1f2329;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 内容区域：宽 640，上下边距 60，水平居中 ===== */
  .page {
    width: 640px;
    max-width: 100%;
    margin: 0 auto;
    padding: 60px 0;
  }

  /* ===== 列表：无表头、无标题 ===== */
  .profile-list {
    display: flex;
    flex-direction: column;
    gap: 8px;                 /* 行与行之间 */
    margin: 0;
    padding: 0;
    list-style: none;
  }

  /* ===== 单行卡片：头像 + 信息 + 拖动手柄 ===== */
  .profile-item {
    position: relative;       /* 供插入指示线定位 */
    display: flex;
    align-items: center;
    gap: 12px;                /* 左右间距 ≥ 8px */
    padding: 12px;
    border: 1px solid transparent;   /* 预留边缘，避免状态切换时跳动 */
    border-radius: 10px;
    background: #fff;
    transition: background-color .15s ease, border-color .15s ease,
                box-shadow .15s ease, opacity .15s ease;
    user-select: none;
  }

  /* 悬停：轻微边缘与底色变化，暗示「可操作」 */
  .profile-item:hover {
    background: #f6f7f9;
    border-color: #e8ebf1;
    box-shadow: 0 1px 2px rgba(31, 35, 41, .04);
  }

  /* ===== 拖拽中：原位变成虚线「空槽」，内容淡化 ===== */
  .profile-item.dragging {
    opacity: 1;
    background: #f7f8fa;
    border-color: #ccd4e0;
    border-style: dashed;
    box-shadow: none;
    cursor: grabbing;
  }
  .profile-item.dragging > .avatar,
  .profile-item.dragging > .info {
    opacity: .35;
  }

  /* ===== 拖影：边缘描边 + 强阴影 + 微旋转，制造浮起层次感 ===== */
  .drag-ghost {
    position: fixed;
    top: -9999px;
    left: -9999px;
    margin: 0;
    pointer-events: none;
    background: #fff;
    border: 1px solid rgba(74, 108, 247, .45);
    border-radius: 12px;
    box-shadow:
      0 18px 40px -8px rgba(31, 35, 41, .28),
      0 6px 16px rgba(31, 35, 41, .12),
      0 0 0 1px rgba(255, 255, 255, .6) inset;
    transform: rotate(1.5deg) scale(1.02);
    opacity: .97;
    transition: none;
    overflow: hidden;
  }
  .drag-ghost .drag-handle { opacity: 1; color: #8a919b; }

  /* ===== 插入位置指示线 ===== */
  .profile-item.drop-before::before,
  .profile-item.drop-after::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    height: 2px;
    border-radius: 2px;
    background: #4a6cf7;
    box-shadow: 0 0 0 3px rgba(74, 108, 247, .15);
    z-index: 1;
  }
  .profile-item.drop-before::before { top: -5px; }
  .profile-item.drop-after::after  { bottom: -5px; }

  /* ===== 头像 56px ===== */
  .avatar {
    flex: 0 0 56px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    overflow: hidden;
    transition: opacity .15s ease;
  }
  .avatar.a1 { background: linear-gradient(135deg, #8fb3ff, #4a6cf7); }
  .avatar.a2 { background: linear-gradient(135deg, #ffa8c9, #ef5b8f); }
  .avatar.a3 { background: linear-gradient(135deg, #7fdcc4, #14b48b); }
  .avatar.a4 { background: linear-gradient(135deg, #ffcf8f, #f59331); }
  .avatar.a5 { background: linear-gradient(135deg, #b3a1ff, #7a5cf0); }

  /* ===== 右侧信息区（三行，行间距 ≥ 8px） ===== */
  .info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: opacity .15s ease;
  }

  /* 第一行：姓名 + 性别年龄标签 */
  .row-main {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .name {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
    color: #1f2329;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 性别符号 + 年龄：12px 文字标签样式 */
  .meta {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .meta.male   { color: #2f6fed; background: #e9f0ff; }
  .meta.female { color: #e1488b; background: #fdeaf3; }

  /* 第二行：身高 / 体重 */
  .row-basic {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    line-height: 1.4;
    color: #4e5969;
  }
  .row-basic .sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #c9cdd4;
  }

  /* 第三行：标签 */
  .row-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    font-size: 12px;
    line-height: 1.4;
    color: #999;
    background: #ececec;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  /* ===== 拖动手柄：鼠标悬停 / 聚焦时显示 ===== */
  .drag-handle {
    flex: 0 0 auto;
    width: 20px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c0c4cc;
    opacity: 0;
    cursor: grab;
    transition: opacity .15s ease, color .15s ease;
  }
  .profile-item:hover .drag-handle,
  .profile-item:focus-within .drag-handle { opacity: 1; }
  .drag-handle:hover { color: #8a919b; }
  .profile-item.dragging .drag-handle { opacity: 0; }
  .drag-handle:active { cursor: grabbing; }
</style>
</head>
<body>

  <main class="page">
    <div class="profile-list" id="profileList">

      <!-- 1 -->
      <div class="profile-item" draggable="true">
        <div class="avatar a1">张</div>

        </div>
        <div class="drag-handle" title="拖动调整顺序" aria-label="拖动调整顺序">
          <svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/>
            <circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/>

          </svg>
        </div>
      </div>

      <!-- 2 -->
      <div class="profile-item" draggable="true">
        <div class="avatar a2">李</div>
        <div class="info">
          <div class="row-main">
            <span class="name">李静</span>
            <span class="meta female">♀ 26岁</span>
          </div>
          <div class="row-basic">
            <span>身高 165cm</span>
            <span class="sep"></span>
            <span>体重 50kg</span>
          </div>
          <div class="row-tags">
            <span class="tag">UI设计师</span>
            <span class="tag">旅行</span>
          </div>
        </div>
        <div class="drag-handle" title="拖动调整顺序" aria-label="拖动调整顺序">
          <svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/>
            <circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/>
            <circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/>
          </svg>
        </div>
      </div>

      <!-- 3 -->
      <div class="profile-item" draggable="true">
        <div class="avatar a3">王</div>
        <div class="info">
          <div class="row-main">
            <span class="name">王浩</span>
            <span class="meta male">♂ 32岁</span>
          </div>
          <div class="row-basic">
            <span>身高 182cm</span>

          </div>
          <div class="row-tags">
            <span class="tag">后端开发</span>

        </div>
        <div class="drag-handle" title="拖动调整顺序" aria-label="拖动调整顺序">
          <svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/>
            <circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/>
            <circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/>
          </svg>
        </div>
      </div>

      <!-- 4 -->
      <div class="profile-item" draggable="true">
        <div class="avatar a4">陈</div>
        <div class="info">
          <div class="row-main">
            <span class="name">陈曦</span>
            <span class="meta female">♀ 30岁</span>
          </div>
          <div class="row-basic">
            <span>身高 168cm</span>
            <span class="sep"></span>
            <span>体重 55kg</span>
          </div>
          <div class="row-tags">
            <span class="tag">运营总监</span>

        <div class="drag-handle" title="拖动调整顺序" aria-label="拖动调整顺序">
          <svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/>
            <circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/>

      <!-- 5 -->
      <div class="profile-item" draggable="true">
        <div class="avatar a5">刘</div>
        <div class="info">
          <div class="row-main">
            <span class="name">刘洋</span>
            <span class="meta male">♂ 24岁</span>
          </div>
          <div class="row-basic">
            <span>身高 175cm</span>

          <svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/>
            <circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/>
            <circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/>
          </svg>
        </div>
      </div>

    </div>
  </main>

<script>
(function () {
  const list = document.getElementById('profileList');
  let dragged = null;      // 当前被拖拽的卡片
  let ghost = null;        // 自定义拖影节点
  let indicatorEl = null;  // 当前显示指示线的元素
  let indicatorPos = null; // 'before' | 'after'

  /* ---------- 插入指示线 ---------- */
  function clearIndicator() {
    if (indicatorEl) {
      indicatorEl.classList.remove('drop-before', 'drop-after');
      indicatorEl = null;
      indicatorPos = null;
    }
  }

  function setIndicator(el, pos) {
    if (indicatorEl === el && indicatorPos === pos) return;
    clearIndicator();
    if (!el) return;
    el.classList.add(pos === 'before' ? 'drop-before' : 'drop-after');
    indicatorEl = el;
    indicatorPos = pos;
  }

  /* ---------- 找到「应插入到哪个元素之前」，null 表示放到末尾 ---------- */
  function getDragAfterElement(y) {
    const items = [...list.querySelectorAll('.profile-item:not(.dragging)')];

    return items.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2; // 鼠标相对元素中心
      if (offset < 0 && offset > closest.offset) {
        return { offset, element: child };
      }
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  list.querySelectorAll('.profile-item').forEach((item) => {
    item.setAttribute('draggable', 'true');

    item.addEventListener('dragstart', (e) => {
      dragged = item;
      item.classList.add('dragging');

      e.dataTransfer.effectAllowed = 'move';
      // Firefox 必须有数据才能拖动
      e.dataTransfer.setData('text/plain',
        item.querySelector('.name') ? item.querySelector('.name').textContent : '');

      /* ---- 自定义拖影：边缘描边 + 投影 + 微旋转，形成浮起的层次感 ---- */
      const rect = item.getBoundingClientRect();

      const clone = item.cloneNode(true);
      clone.classList.remove('dragging', 'drop-before', 'drop-after');
      clone.classList.add('drag-ghost');
      clone.style.width = rect.width + 'px';
      clone.style.height = rect.height + 'px';
      document.body.appendChild(clone);
      ghost = clone;

      // 让鼠标在拖影中的相对位置与按下时一致
      const offsetX = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
      const offsetY = Math.min(Math.max(e.clientY - rect.top, 0), rect.height);
      e.dataTransfer.setDragImage(clone, offsetX, offsetY);
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      if (ghost) { ghost.remove(); ghost = null; }
      clearIndicator();
      dragged = null;
    });
  });

  list.addEventListener('dragover', (e) => {
    if (!dragged) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    const after = getDragAfterElement(e.clientY);

    if (after == null) {
      // 放到末尾：最后一张卡片下方画线
      const rest = [...list.querySelectorAll('.profile-item:not(.dragging)')];
      const last = rest[rest.length - 1];
      if (last) setIndicator(last, 'after');
    } else {
      // 插到 after 之前：在 after 顶部画线
      setIndicator(after, 'before');
    }

    // 实时重排 DOM
    if (after == null) {
      list.appendChild(dragged);
    } else if (after !== dragged) {
      list.insertBefore(dragged, after);
    }
  });

  list.addEventListener('drop', (e) => e.preventDefault());

  // 鼠标拖出列表时，去掉指示线
  list.addEventListener('dragleave', (e) => {
    if (!list.contains(e.relatedTarget)) clearIndicator();
  });
})();
</script>
</body>
</html>
